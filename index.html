<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Destruction System Ads</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .center-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 20px;
      text-align: center;
    }

    .center-block p {
      font-size: 20px;
      color: #222;
    }

    .tg-btn {
      display: inline-block;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      background: #0088cc;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .tg-btn:hover {
      background: #0077b3;
    }

    .tg-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div class="center-block">
    <!-- Тут пиши свой текст -->
    <p>Твой текст</p>

    <!-- Замени ссылку на свою -->
    <a class="tg-btn" href="https://t.me/TimateStudio" target="_blank" rel="noopener">
      Перейти в Telegram
    </a>
  </div>

</body>
</html>
